<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>INSIGHT Risk Evaluation</title>
  <link rel="stylesheet" as="style" crossorigin href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard/dist/web/static/pretendard.css">
  <link rel="stylesheet" href="./styles.css">
</head>
<body data-page="evaluation">
  <div class="evaluation-shell">
    <header class="hero evaluation-hero">
      <div>
        <img class="brand-logo" src="./2601 New Product logos_Lunit INSIGHT Risk_b.png" alt="Lunit INSIGHT Risk">
        <p class="eyebrow">Customer Evaluation</p>
        <h1>INSIGHT Risk Presentation Prototypes</h1>
      </div>
      <div class="hero-note">
        <p id="summaryText">Risk 2.4% is above NCCN 1.7% and below USPSTF/ASCO 3.0%.</p>
      </div>
    </header>

    <section class="evaluation-meta panel">
      <p class="meta-line"><strong id="metaPatient">53F screening mammography</strong></p>
      <p class="meta-line" id="metaStudy">Bilateral screening mammogram, no suspicious interval change</p>
    </section>

    <main class="grid evaluation-grid" id="evaluationGrid"></main>
  </div>

  <script src="./script.js"></script>
</body>
</html>
